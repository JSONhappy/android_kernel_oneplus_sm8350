# 为你Fork的项目编写一个自动编译的工作流
name: 编译我的 Fork 项目

# 触发器：当推送代码到 'main' 或 'master' 分支时运行
on:
  push:
    branches:
      - main
      - master

jobs:
  # 定义一个名为 "build" 的任务
  build:
    # 运行环境：选择最新的Ubuntu环境
    runs-on: ubuntu-latest
    
    # 任务步骤
    steps:
      # 步骤1：拉取你仓库的代码 [citation:1][citation:7]
      - name: 1. 检出代码
        uses: actions/checkout@v4

      # 步骤2：设置项目需要的语言环境（这里以Node.js为例）
      - name: 2. 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 指定Node.js版本，根据项目修改

      # 步骤3：安装项目依赖（命令因项目而异）
      - name: 3. 安装依赖
        run: npm install # 如果是Python项目，可能是 pip install -r requirements.txt

      # 步骤4：执行编译命令（核心步骤！命令因项目而异）
      - name: 4. 编译项目
        run: npm run build # 这是很多前端/Node.js项目的编译命令，请根据项目文档修改

      # 步骤5：上传编译好的文件（产物） [citation:6][citation:7]
      - name: 5. 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          # 给产物起个名字
          name: 我的编译版本-${{ github.sha }} # github.sha 是当前提交的唯一ID，用于区分版本
          # 指定要上传的文件夹或文件路径，通常是编译命令输出的目录
          path: |
            dist/
            out/
            build/
          # 如果上面的目录都不存在，可以尝试上传特定文件
          # path: target/release/my-app.exe 
