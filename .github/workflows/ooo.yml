name: 编译别人的代码

# 触发条件：当你向 main 分支推送代码时自动运行
on:
  push:
    branches: [ "main" ]
  # 也允许你手动触发
  workflow_dispatch:

jobs:
  build:
    # 选择运行环境，比如最新的 Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 第一步：把你的代码下载到服务器上
      - name: 拉取代码
        uses: actions/checkout@v4

      # 第二步：安装编译所需的依赖（这里以常见的构建工具为例）
      - name: 安装依赖
        run: |
          sudo apt-get update
          # 如果你的项目是 C/C++，可能需要安装 build-essential, cmake 等
          # 如果是 Node.js 项目，可能需要安装 npm
          # 请根据实际情况修改这行命令
          echo "正在安装依赖..."

      # 第三步：执行真正的编译命令（这里是核心！）
      - name: 开始编译
        run: |
          # 在这里写下你在自己电脑上编译时需要敲的命令
          # 例如：
          # make
          # 或
          # npm install && npm run build
          # 或
          # python setup.py build
          echo "正在编译..."

      # 第四步：上传编译好的结果
      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: 我的编译成果
          path: |
            # 这里指定要打包的文件夹或文件，例如：
            # dist/
            # *.ipk
            # output/
            README.md
